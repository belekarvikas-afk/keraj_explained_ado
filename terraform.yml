trigger:
  - main

pool:
  name: 'Default'

steps:

- checkout: self

- task: TerraformInstaller@1
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: '1.15.9'

- powershell: |
    Write-Host "===== Terraform Command ====="
    Get-Command terraform -ErrorAction SilentlyContinue | Format-List *

    Write-Host "===== Terraform Version ====="
    terraform version

    Write-Host "===== Terraform EXE Check ====="
    $terraformPath = "C:\agents\vsts-agent-win-x64-5.278.0\_work\_tool\terraform\1.15.9\x64\terraform.exe"

    Write-Host "Checking:"
    Write-Host $terraformPath

    if (Test-Path $terraformPath) {
        Write-Host "Terraform EXE EXISTS"
        Get-Item $terraformPath | Format-List FullName,Length,CreationTime,LastWriteTime
    }
    else {
        Write-Host "Terraform EXE DOES NOT EXIST"
        Write-Host "Listing Terraform tool directory..."

        Get-ChildItem `
          "C:\agents\vsts-agent-win-x64-5.278.0\_work\_tool\terraform" `
          -Recurse -ErrorAction SilentlyContinue |
          Select-Object FullName
    }
  displayName: 'Debug Terraform Installation'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)environments/preprod/environmentsenvironments/preprod/preprod'
    backendServiceArm: 'keraj_svc'
    backendAzureRmOverrideSubscriptionID: '83d4cba0-c6b0-4b71-8050-0b7fd5ba5202'
    backendAzureRmResourceGroupName: 'b18g35-common-rg'
    backendAzureRmStorageAccountName: 'b18g35storageaccount2'
    backendAzureRmContainerName: 'vkcontainer'
    backendAzureRmKey: 'vikasbhai.tfstate'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)environments/preprod/'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)environments/preprod/'
    environmentServiceNameAzureRM: 'keraj_svc'
    environmentAzureRmOverrideSubscriptionID: '83d4cba0-c6b0-4b71-8050-0b7fd5ba5202'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(System.DefaultWorkingDirectory)environments/preprod/'
    commandOptions: '--auto-approve'
    environmentServiceNameAzureRM: 'keraj_svc'
    environmentAzureRmOverrideSubscriptionID: '83d4cba0-c6b0-4b71-8050-0b7fd5ba5202'